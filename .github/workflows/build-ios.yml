name: Compilar Gitos Fiesta iOS

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Instalar cargas de trabajo de .NET MAUI
      run: |
        dotnet workload restore
        dotnet workload install maui

    - name: Compilar proyecto iOS
      run: |
        dotnet build gitosfiesta/gitosfiesta.csproj -f net9.0-ios -c Release
      env:
        # Esto le permite a .NET usar la versión de Xcode instalada en el runner sin bloquear por el parche menor
        MD_APPLE_SDK_LOCK_ITERS: "1"
        XCODE_DEVELOPER_DIR_PATH: "/Applications/Xcode.app"
