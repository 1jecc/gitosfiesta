name: Compilar Gitos Fiesta iOS (.ipa)

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Instalar cargas de trabajo de .NET MAUI
      run: |
        dotnet workload restore
        dotnet workload install maui

    - name: Seleccionar Xcode compatible
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.5.0'

    - name: Omitir recursos de iconos faltantes
      run: |
        sed -i '' '/MauiIcon/d' gitosfiesta/gitosfiesta.csproj || true
        sed -i '' '/MauiSplashScreen/d' gitosfiesta/gitosfiesta.csproj || true

    - name: Compilar y empaquetar .ipa para iOS
      run: |
        dotnet publish gitosfiesta/gitosfiesta.csproj -f net9.0-ios -c Release -r ios-arm64 /p:ArchiveOnBuild=true /p:EnableCodeSigning=false /p:CheckForUnsupportedXcode=false

    - name: Subir ejecutable .ipa como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitosFiesta-iOS
        path: |
          gitosfiesta/bin/Release/net9.0-ios/ios-arm64/publish/*.ipa
          gitosfiesta/bin/Release/net9.0-ios/ios-arm64/*.app
