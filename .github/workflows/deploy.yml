name: Desplegar Blazor Web a GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compilar y publicar la app Blazor Web
        run: |
          dotnet publish gitosfiesta/GitosFiesta.Web/GitosFiesta.Web.csproj -c Release -o release /p:RunAOTCompilation=false
          
          # Verificamos dónde se generó wwwroot y aseguramos los archivos de configuración
          if [ -d "release/wwwroot" ]; then
            touch release/wwwroot/.nojekyll
            cp release/wwwroot/index.html release/wwwroot/404.html
          elif [ -d "release/GitosFiesta.Web/dist" ]; then
            cp -r release/GitosFiesta.Web/dist/* release/
            touch release/.nojekyll
            cp release/index.html release/404.html
          fi

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
