name: Desplegar Blazor Web a GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compilar y publicar la app Blazor Web
        run: |
          dotnet publish gitosfiesta/GitosFiesta.Web/GitosFiesta.Web.csproj -c Release -o release
          touch release/wwwroot/.nojekyll

      - name: Configurar páginas de GitHub
        uses: actions/configure-pages@v4

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
